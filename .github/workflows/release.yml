name: Release

# oss-sync.yml, en el monorepo privado, sincroniza este repo y empuja el tag v*. Este archivo no se sincroniza: se edita aquí.
# Se construye en el repo público porque sus runners estándar no gastan la cuota de la cuenta privada.
on:
  push:
    tags: ["v*"]
  # Ensayo: compila, prueba y borra sus artefactos sin publicar nada.
  workflow_dispatch:

# Los jobs que compilan (pnpm install, npm install postject) solo leen; escribir y firmar queda en el job release.
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Versión desde el tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_EVENT_NAME" = push ] || VERSION=0.0.0-ensayo
          cd kofre-cli && npm version --no-git-tag-version --allow-same-version "$VERSION"
      - run: pnpm --filter @kofre/crypto test
      - run: pnpm --filter @kofre/cli test
      - run: pnpm --filter @kofre/cli build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle
          retention-days: 1
          path: |
            kofre-cli/dist/kofre.js
            kofre-cli/dist/ui.mjs
            kofre-cli/package.json
      - name: Publicar en npm
        if: github.event_name == 'push' && env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd kofre-cli && npm publish --access public --provenance

  binaries:
    needs: bundle
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: kofre-linux-x64
          - os: macos-15-intel
            asset: kofre-macos-x64
          - os: macos-14
            asset: kofre-macos-arm64
          - os: windows-latest
            asset: kofre-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle
          path: kofre-cli
      - run: npm install --no-save --no-package-lock postject@1.0.0-alpha.6
      - run: node scripts/build-sea.mjs "dist/${{ matrix.asset }}"
      - name: Humo
        shell: bash
        run: |
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} --help | head -3
      # kofre ui en una pseudo-terminal: falla si no pinta la interfaz (0.4.0 y 0.4.1 no encontraban ui.mjs en el binario).
      # ponytail: solo Linux, donde `script` y `timeout` vienen de serie; el fallo de empaquetado es igual en las cuatro plataformas.
      - name: Humo de kofre ui
        if: runner.os == 'Linux'
        # Con CI=true Ink no pinta nada hasta desmontar (modo CI), y la prueba no vería la interfaz.
        env:
          CI: "false"
          KOFRE_NO_UPDATE_CHECK: "1"
        run: |
          timeout 5 script -qec "./dist/${{ matrix.asset }} ui" /dev/null > ui.out 2>&1 || true
          grep -q "Iniciar sesión" ui.out || { cat ui.out; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          retention-days: 1
          path: dist/${{ matrix.asset }}

  release:
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Firma keyless con Sigstore: el certificado identifica a este workflow y este repo, sin clave que custodiar.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Checksums y manifiestos
        run: |
          mkdir -p release
          for a in kofre-linux-x64 kofre-macos-x64 kofre-macos-arm64 kofre-windows-x64.exe; do cp "artifacts/$a/$a" release/; done
          cp scripts/install.sh release/install.sh
          (cd release && sha256sum kofre-* > SHA256SUMS)
          node scripts/release-manifests.mjs "${GITHUB_REF_NAME#v}" release/SHA256SUMS release
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      # Firma la lista de sumas: quien verifique la firma sabe que las sumas (y por tanto los binarios) salieron de este workflow.
      - name: Firmar SHA256SUMS
        run: cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
      # RELEASES_TOKEN: PAT con contents:write en kofre-releases, homebrew-tap, scoop-kofre y kofre-cli. Sin él este job falla.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
          token: ${{ secrets.RELEASES_TOKEN }}
          repository: kofrehq/kofre-releases
          target_commitish: main
      - name: Actualizar tap de Homebrew, bucket de Scoop e install.sh
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          for pair in "homebrew-tap:Formula/kofre.rb:kofre.rb" "scoop-kofre:bucket/kofre.json:kofre.json" "kofre-releases:install.sh:install.sh"; do
            repo="${pair%%:*}"; rest="${pair#*:}"; dest="${rest%%:*}"; src="${rest#*:}"
            git clone "https://x-access-token:${RELEASES_TOKEN}@github.com/kofrehq/${repo}.git" "/tmp/${repo}"
            mkdir -p "/tmp/${repo}/$(dirname "$dest")"
            cp "release/${src}" "/tmp/${repo}/${dest}"
            (cd "/tmp/${repo}" && git config user.name "kofre-release" && git config user.email "release@kofre.local" && git add -A && (git commit -m "kofre ${GITHUB_REF_NAME}" || true) && git push)
          done

  # Los artefactos solo llevan los binarios entre jobs. Se borran después de comprobar lo publicado; si algo falla, caducan en un día.
  cleanup:
    needs: [binaries, release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.binaries.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPO: kofrehq/kofre-releases
    steps:
      - name: Verificar la release publicada
        if: github.event_name == 'push'
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$RELEASE_REPO" -D published -p 'kofre-*' -p SHA256SUMS
          cd published
          [ "$(wc -l < SHA256SUMS)" -eq 4 ]
          sha256sum -c SHA256SUMS
      - name: Borrar los artefactos de esta ejecución
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" -q '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
